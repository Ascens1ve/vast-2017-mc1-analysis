services:
  ml:
    build: ./ml
    ports:
      - "127.0.0.1:${ML_PORT:-8767}:8767"
    volumes:
      - ./ml/model:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8767/v1/live', timeout=5).close()"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: vast
      POSTGRES_USER: vast
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U vast -d vast"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
